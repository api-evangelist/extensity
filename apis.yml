name: Extensity
description: ExtensityAI is an AI research company building trustworthy, verifiable AI for enterprise
  environments through a neurosymbolic architecture that combines large language models with symbolic
  validation and knowledge-graph reasoning. Its flagship open-source framework, SymbolicAI, treats LLMs
  as programmable, differentiable primitives (Symbol objects) governed by Design-by-Contract validation,
  giving developers source-traceable, contract-enforced AI they can run on-premise with sovereign data
  control. The company also ships developer tooling including the ontoloom MCP server for building and
  exploring OWL 2 ontologies with AI agents. Backed by Lightspeed Venture Partners.
